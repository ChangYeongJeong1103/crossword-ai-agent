[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "crossword-ai-agent"
version = "0.2.0"
description = "A compact crossword agent: propose, verify, revise."
requires-python = ">=3.11"
dependencies = ["streamlit>=1.40,<2"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
addopts = "-q"
pythonpath = ["."]
testpaths = ["tests"]

[tool.setuptools]
packages = ["src"]
